[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-storage-codec-reed-solomon"
version = "2.0.0"
description = "DNA-Storage: Fountain Code & Reed-Solomon Base-4 DNA Codec Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dna-storage-codec-reed-solomon = "dna_storage_codec.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/dna-storage-codec-reed-solomon"
Repository = "https://github.com/abusuraihsakhri/dna-storage-codec-reed-solomon.git"
