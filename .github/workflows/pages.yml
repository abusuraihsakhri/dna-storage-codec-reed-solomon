name: Deploy static DNA codec to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages HTML and JavaScript
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "${PAGE_URL}" | grep -q "DNA Storage Codec" &&
               curl --fail --silent --show-error --location "${PAGE_URL}codec.mjs" | grep -q "export async function encodeBytes"; then
              echo "Deployed page and codec module verified."
              exit 0
            fi
            sleep 5
          done
          echo "Deployed GitHub Pages smoke test failed." >&2
          exit 1
