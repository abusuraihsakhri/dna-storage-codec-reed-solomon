name: Test and security checks

on:
  push:
    branches: [master, audit/**]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      AUDIT_SECRET_KEY: "ci-test-only-secret-not-for-production-2026"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q agents dna_storage_codec cli.py enrichment.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run standalone browser-codec tests
        run: node --test web/test_codec.mjs
      - name: Validate embedded browser module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("web/index.html").read_text()
          assert '<script type="module">' in html
          script = html.split('<script type="module">', 1)[1].split('</script>', 1)[0]
          Path("/tmp/dna-web-ui.mjs").write_text(script)
          PY
          node --check /tmp/dna-web-ui.mjs
      - name: Verify an actual signed audit entry
        run: |
          python - <<'PY'
          from agents.base import AuditTrail
          trail = AuditTrail("ci-test-only-secret-not-for-production-2026")
          trail.log("CI", "test", "VERIFY", {"safe": True})
          assert trail.verify_integrity()
          trail.logs[-1]["actor"] = "FORGED"
          assert not trail.verify_integrity()
          PY
      - name: Build distributable
        run: python -m build
